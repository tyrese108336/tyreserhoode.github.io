<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Arena Chess</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#08111f;color:#f5f7fb}
.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#1677ff,#7c3aed);display:grid;place-items:center;font-size:31px}
h1{margin:0;font-size:28px}p{color:#aeb9c9}.layout{display:grid;grid-template-columns:1fr 300px;gap:22px}
.card{background:#101c2e;border:1px solid #20314a;border-radius:22px;padding:20px;box-shadow:0 15px 40px #0004}
.board{width:min(78vw,680px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:8px solid #111;border-radius:8px;overflow:hidden}
.sq{display:grid;place-items:center;font-size:clamp(24px,7vw,58px);cursor:pointer;user-select:none}
.white{background:#f3f3f3;color:#111}.black{background:#242424;color:#fff}
.selected{outline:4px solid #4f8cff;outline-offset:-4px}.legal{box-shadow:inset 0 0 0 5px #777}
button{border:0;border-radius:12px;padding:12px 16px;background:#1976ff;color:#fff;font-weight:700;cursor:pointer;margin:5px}
button.secondary{background:#22334c}.row{display:flex;flex-wrap:wrap;gap:5px}
.moves{max-height:250px;overflow:auto;background:#0a1423;padding:12px;border-radius:14px}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #22314a}
@media(max-width:800px){.layout{grid-template-columns:1fr}.board{width:min(94vw,650px)}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">♞</div><div><h1>ROYAL ARENA</h1><p>Clean chess. Big battles.</p></div></div>
  <div class="layout">
    <main class="card">
      <div class="row">
        <button onclick="newGame()">New Game</button>
        <button class="secondary" onclick="flip()">Flip Board</button>
        <button class="secondary" onclick="undo()">Undo</button>
        <button class="secondary" onclick="resign()">Resign</button>
      </div>
      <h2 id="turn">White to move</h2>
      <div id="board" class="board"></div>
    </main>
    <aside class="card">
      <h2>Game</h2>
      <div class="stat"><span>White</span><b>Player 1</b></div>
      <div class="stat"><span>Black</span><b>Player 2</b></div>
      <h3>Moves</h3><div id="moves" class="moves">No moves yet.</div>
      <h3>How to play</h3><p>Tap a piece, then tap its destination. This version is local two-player.</p>
    </aside>
  </div>
</div>
<script>
const P={
r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',
R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'
};
let board,turn,selected=null,history=[],flipped=false;
function initial(){return[
['r','n','b','q','k','b','n','r'],Array(8).fill('p'),
Array(8).fill(''),Array(8).fill(''),Array(8).fill(''),Array(8).fill(''),
Array(8).fill('P'),['R','N','B','Q','K','B','N','R']] }
function newGame(){board=initial();turn='w';selected=null;history=[];render()}
function color(x){return !x?'':x===x.toUpperCase()?'w':'b'}
function render(){
 const el=document.getElementById('board');el.innerHTML='';
 for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){
  let r=flipped?7-vr:vr,c=flipped?7-vc:vc;
  let s=document.createElement('div');s.className='sq '+((r+c)%2?'black':'white');
  if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');
  s.textContent=P[board[r][c]]||'';s.onclick=()=>clickSq(r,c);el.appendChild(s);
 }
 document.getElementById('turn').textContent=(turn==='w'?'White':'Black')+' to move';
 document.getElementById('moves').innerHTML=history.length?history.map((m,i)=>`${i+1}. ${m}`).join('<br>'):'No moves yet.';
}
function clickSq(r,c){
 let piece=board[r][c];
 if(selected){
  if(canMove(selected[0],selected[1],r,c)){
   history.push(`${name(board[selected[0]][selected[1]])} ${coord(selected[0],selected[1])} → ${coord(r,c)}`);
   board[r][c]=board[selected[0]][selected[1]];board[selected[0]][selected[1]]='';
   if(piece&&piece.toLowerCase()==='p'&&(r===0||r===7))board[r][c]=turn==='w'?'Q':'q';
   turn=turn==='w'?'b':'w';selected=null;render();return;
  }
 }
 if(piece&&color(piece)===turn)selected=[r,c];else selected=null;render();
}
function coord(r,c){return 'abcdefgh'[c]+(8-r)}
function name(x){return x?({p:'Pawn',n:'Knight',b:'Bishop',r:'Rook',q:'Queen',k:'King'})[x.toLowerCase()]:'Piece'}
function canMove(r1,c1,r2,c2){
 if(r1===r2&&c1===c2)return false;
 let p=board[r1][c1],t=board[r2][c2];if(!p||color(p)!==turn||color(t)===turn)return false;
 let dr=r2-r1,dc=c2-c1,a=Math.abs(dr),b=Math.abs(dc),type=p.toLowerCase();
 if(type==='p'){
  let d=turn==='w'?-1:1;
  if(dc===0&&dr===d&&!t)return true;
  if(dc===0&&dr===2*d&&!t&&!board[r1+d][c1]&&(turn==='w'?r1===6:r1===1))return true;
  return a===1&&dc!==0&&dr===d&&!!t;
 }
 if(type==='n')return (a===2&&b===1)||(a===1&&b===2);
 if(type==='k')return a<=1&&b<=1;
 if(type==='r')return (dr===0||dc===0)&&clear(r1,c1,r2,c2);
 if(type==='b')return a===b&&clear(r1,c1,r2,c2);
 if(type==='q')return (a===b||dr===0||dc===0)&&clear(r1,c1,r2,c2);
}
function clear(r1,c1,r2,c2){
 let sr=Math.sign(r2-r1),sc=Math.sign(c2-c1),r=r1+sr,c=c1+sc;
 while(r!==r2||c!==c2){if(board[r][c])return false;r+=sr;c+=sc}return true;
}
function undo(){
 if(!history.length)return;
 newGame();
 alert('Undo is available in the interface, but this simple downloadable build resets the game.'); 
}
function flip(){flipped=!flipped;render()}
function resign(){alert((turn==='w'?'White':'Black')+' resigned. Start a new game to play again.')}
newGame();
</script>
</body>
</html>
